# DevSecOps Stages mapped to the 9 GitLab lifecycle stages
stages:
  - build    # 1. Build
  - check    # 2. Test & 3. Secure (run in parallel)
  - deploy   # 4. Deploy

# STAGE 1: BUILD
build_dependencies:
  stage: build
  image: node:18
  script:
    - echo "🔨 Building: Installing dependencies..."
    - npm install
  artifacts:
    paths:
      - node_modules/

# STAGE 2: CHECK (Test & Secure run in parallel)
test_code:
  stage: check
  image: node:18
  script:
    - echo "🧪 Testing: Running ESLint..."
    - npm run lint
  # NOTE: We DO NOT use allow_failure here. We WANT this to fail initially 
  # so the GitLab Duo Agent can detect the pipeline failure and trigger.

security_audit:
  stage: check
  image: node:18
  script:
    - echo "🔒 Secure: Running npm audit for high/critical vulnerabilities..."
    - npm audit --audit-level=high
  # This should pass on our simple app, proving our dependencies are secure.

# STAGE 3: DEPLOY (Only runs if 'check' stage passes)
deploy_to_gcp:
  stage: deploy
  image: google/cloud-sdk:latest
  script:
    - echo "🚀 Deploy: Authenticating with Google Cloud..."
    - echo "$GCP_SERVICE_ACCOUNT_KEY" > /tmp/key.json
    - gcloud auth activate-service-account --key-file=/tmp/key.json
    - gcloud config set project $GCP_PROJECT_ID
    - echo "🚀 Deploy: Building and pushing Docker image..."
    - gcloud builds submit --tag gcr.io/$GCP_PROJECT_ID/self-healing-app:$CI_COMMIT_SHORT_SHA
    - echo "🚀 Deploy: Deploying to Google Cloud Run..."
    - gcloud run deploy self-healing-app \
        --image gcr.io/$GCP_PROJECT_ID/self-healing-app:$CI_COMMIT_SHORT_SHA \
        --platform managed \
        --region us-central1 \
        --allow-unauthenticated
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"' # Only deploy to production on the main branch
  variables:
    # These will be set in GitLab CI/CD Settings > Variables
    GCP_PROJECT_ID: "your-gcp-project-id"
    GCP_SERVICE_ACCOUNT_KEY: "your-gcp-service-account-json"
